<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <div class="bgcolor"></div>
    <img class="mainimg" src="sunrise.jpg" alt="sunrise" />
    <h1 id="land">LANDING PAGE</h1>
    <h2 class="landing">HIKING</h2>

    <div class="maindiv">
      <div class="navbar">
        <img src="logo.png" alt="hiking" />
        <div class="btn">
          <i class="fa fa-bars"></i>
        </div>
      </div>
      <div class="mainpardiv">
        <img class="logo" src="logo.png" alt="hiking" />

        <nav class="list">
          <a class="ele" href="#">HOME</a>
          <a class="ele" href="#">UPCOMING TREKS</a>
          <a class="ele" href="#">ABOUT</a>
          <a class="ele" href="#">CONTACT</a>
        </nav>

        <p>
          <span id="cll">Call Now</span>
          <span class="number">1800 888 555</span>
        </p>
      </div>
      <div class="parent">
        <div class="parent1">
          <p class="hiking">
            I WANT
            <span id="outnow">TO GO</span>
            <span id="outnow">HIKING</span>
          </p>
          <div class="getout">
            <p>
              GET
              <span id="outnow1">OUT</span>
              <span id="outnow1">NOW</span>
            </p>
            <button class="firstbutton">GET STARTED</button>
          </div>
        </div>
        <img class="hikerimage" src="Hiker.png" alt="Hiker" />
      </div>
      <!-- Middle part ends here  -->
      <div class="joinus">
        <img src="logo2.png" alt="Mountains" />
        <p>
          JOIN US FOR THE WEEKEND TO CLIMB
          <span id="outnow">THE HIGHEST PEAK IN ENGLAND</span>
        </p>
      </div>
      <div class="copyright">
        <div class="footer">&copy; Company Name 2020. All rights reserved.</div>
        <div class="socials">
          <i class="fa fa-instagram"></i>
          <i class="fa fa-facebook"></i>
          <i class="fa fa-twitter"></i>
          <i class="fa fa-whatsapp"></i>
        </div>
      </div>
    </div>
  </body>
</html>
